proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    icon: https://www.svgrepo.com/show/412721/choose.svg
    type: select
    proxies:
      - خودکار 🤖
      - دستی 🤏🏻
      - بدون فیلترشکن 🛡️
      - قطع اینترنت ⛔

  - name: دستی 🤏🏻
    type: select
    icon: https://www.svgrepo.com/show/372331/cursor-hand-click.svg
    proxies:
      - سوئیس 🇨🇭
      - استونی 🇪🇪
      - فنلاند 🇫🇮
      - نروژ 🇳🇴
      - هلند 🇳🇱
      - لوکزامبورگ 🇱🇺
      - نیوزیلند 🇳🇿
      - دانمارک 🇩🇰
      - کانادا 🇨🇦
      - اتریش 🇦🇹
      - بلژیک 🇧🇪
      - لیتوانی 🇱🇹

  - name: خودکار 🤖
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    timeout: 5000
    max-failed-times: 8
    expected-status: 204
    icon: https://www.svgrepo.com/show/415208/backup-cloud-document.svg
    proxies:
      - سوئیس 🇨🇭
      - استونی 🇪🇪
      - فنلاند 🇫🇮
      - نروژ 🇳🇴
      - هلند 🇳🇱
      - لوکزامبورگ 🇱🇺
      - نیوزیلند 🇳🇿
      - دانمارک 🇩🇰
      - کانادا 🇨🇦
      - اتریش 🇦🇹
      - بلژیک 🇧🇪
      - لیتوانی 🇱🇹

  # --- Country Specific Groups ---
  - name: سوئیس 🇨🇭
    type: select
    icon: https://upload.wikimedia.org/wikipedia/commons/0/08/Flag_of_Switzerland_%28Pantone%29.svg
    proxies:
      - خودکار سوئیس
    use:
      - Switzerland

  - name: خودکار سوئیس
    type: url-test
    url: https://www.gstatic.com/generate_204
