tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

proxies:
  - name: "Fake Proxy"
    type: http
    server: 127.0.0.1
    port: 8080

proxy-groups:
  - name: 🔀 DIRECT
    type: select
    hidden: true
    proxies:
      - DIRECT
      - Fake Proxy

rules:
  - MATCH,DIRECT
