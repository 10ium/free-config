port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
log-level: debug
external-controller: 0.0.0.0:9090
secret: ''
bind-address: '*'
find-process-mode: always
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: false
dns:
  enable: true
  ipv6: true
  respect-rules: false
  prefer-h3: true
  cache-algorithm: arc   
  use-system-hosts: true
  use-host: true
  nameserver:
    - 'https://dns.electrotm.org/dns-query'
    - '78.157.42.100'
    - '78.157.42.101'
    - '10.202.10.10'
    - '10.202.10.11'
    - '95.38.132.152'
    - '95.38.132.153'
    - 'https://free.shecan.ir/dns-query'
    - 'tls://free.shecan.ir'
    - '178.22.122.100'
    - '185.51.200.2'


tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

proxies:
  - name: "Fake Proxy"
    type: http
    server: 127.0.0.1
    port: 8080

proxy-groups:
  - name: 🔀 DIRECT
    type: select
    proxies:
      - DIRECT
      - Fake Proxy

rules:
  - MATCH,🔀 DIRECT
